<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="background-glow"></div>
  <div class="flowers" id="flowers"></div>

  <main class="container">

    <div class="top-text">
      breathe slowly.
    </div>

    <h1 id="peaceWord">Peace</h1>

    <div class="circle-wrapper">
      <div class="breathing-circle" id="breathingCircle">
        <div class="phase-text" id="phaseText">Tap to Begin</div>
      </div>
    </div>

    <div class="timer" id="timer">4</div>

    <button id="startButton">Start Breathing</button>

    <div class="instructions">
      Box breathing • Inhale 4 • Hold 4 • Exhale 4 • Hold 4
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
